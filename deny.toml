# cargo-deny configuration. Run locally with `cargo deny check`.

[advisories]
yanked = "deny"

# Six advisories, all of class `unmaintained` — **none is a vulnerability**.
# Each is transitive through Tauri and unreachable from anything we could
# change short of dropping the desktop shell.
#
# Listed by ID on purpose, rather than relaxing the policy with
# `unmaintained = "workspace"`. That setting would stop reporting *every*
# transitive unmaintained crate, including the seventh one, which nobody would
# then look at. Naming these six means a new one still fails the build and
# gets read by a person — which is the only reason to run this check.
#
# Worth re-reading when Tauri is upgraded: if an entry no longer applies,
# cargo-deny says so, and it should be deleted rather than carried.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, unmaintained. A proc macro, so build-time only, and only on Linux: it arrives through glib-macros and gtk3-macros, the GTK bindings the webview needs." },

    # One root, five crates. `urlpattern` is the only thing that wants the
    # `unic` family, and it comes from `tauri-utils` — reached through
    # `tauri-build` and `tauri-codegen`, which run while the app is compiled.
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property, unmaintained. Via urlpattern <- tauri-utils." },
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range, unmaintained. Via urlpattern <- tauri-utils." },
    { id = "RUSTSEC-2025-0080", reason = "unic-common, unmaintained. Via urlpattern <- tauri-utils." },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident, unmaintained. Via urlpattern <- tauri-utils." },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version, unmaintained. Via urlpattern <- tauri-utils." },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

# The six workspace crates are declared as `{ path = "crates/..." }` with no
# version, and a version-less path dependency resolves to `*` — which is what
# `wildcards = "deny"` above exists to catch. For a dependency pulled from a
# registry that rule is right: `*` means any future breaking release is
# accepted sight unseen.
#
# It says nothing here. These crates are `publish = false` and are never
# resolved from a registry; the path *is* the version. Adding a `version` field
# to each would be a number to bump in lockstep across seven manifests, buying
# nothing. This option is cargo-deny's own answer to that case, and it still
# only applies to unpublished crates.
allow-wildcard-paths = true

[licenses]
# SpecShield ships as a desktop binary, so the question for every dependency is
# what its licence asks of the thing we distribute.
#
# The original rule here was "permissive only", and it failed the build on the
# dependencies the product has always had. The rule was aspirational rather
# than descriptive; what follows is the same policy stated accurately, with
# each non-permissive entry justified individually rather than waved through.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",

    # Boost Software License. Permissive, and notably it requires no
    # attribution in binary distributions at all — a weaker ask than MIT.
    #   clipboard-win, error-code
    #     ← arboard ← tauri-plugin-clipboard-manager, and directly from
    #       specshield-app, which sets the three Windows clipboard opt-out
    #       formats (SDD §17, Threat Model §5.9).
    "BSL-1.0",

    # Mozilla Public License 2.0. **Not permissive — weak copyleft** — and it
    # is allowed here because its obligation is per *file*, not per program.
    # MPL §3.3 permits distributing a Larger Work under other terms; what it
    # requires is that modifications to the MPL-covered files themselves be
    # published. We modify none of them.
    #
    #   cssparser, cssparser-macros, selectors, dtoa-short
    #     ← dom_query ← tauri-utils, as a **build-dependency**. These parse CSP
    #       at build time and are not in the shipped binary, so the
    #       distribution trigger does not arise for them at all.
    #   option-ext
    #     ← dirs-sys ← dirs. This one does ship. Unmodified, so the obligation
    #       is satisfied by leaving it that way.
    #
    # If any of these is ever vendored and patched, that patch has to be
    # published. That is the whole of the exposure, and it is worth re-reading
    # this comment before doing so.
    "MPL-2.0",
]
confidence-threshold = 0.9

# Our own crates declare `license = "UNLICENSED"`, which is not an SPDX
# expression and is deliberately not in the allow list above. They are all
# `publish = false`, so nothing here is distributed as a crate and the license
# check has nothing to say about them — without this, cargo-deny fails the
# build on the workspace itself rather than on a dependency.
#
# This does not settle the repository's licensing. See the README: no LICENSE
# file means all rights reserved, which is a decision to make rather than a
# default to inherit.
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
