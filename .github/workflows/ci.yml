name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings everywhere, not just in the clippy job.
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `app/src-tauri` is a workspace member, so every `--workspace` command
      # builds it — and its build script needs the webview headers. Without
      # these the job fails in `tauri-build`, nowhere near anything a reader
      # would connect to the desktop app.
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev             libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev             libayatana-appindicator3-dev libxdo-dev patchelf
      # `app/dist` is generated and gitignored, and `tauri.conf.json` points
      # `frontendDist` at it. A fresh checkout has no such directory, so the
      # Tauri build script fails on every platform — which is what made the
      # first push's `test`, `clippy` and `rustdoc` jobs all red while the same
      # commands passed locally, where a stale `dist/` happened to exist.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: build the frontend the Tauri crate embeds
        working-directory: app
        run: |
          npm ci
          npm run build
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary target and the one where the SQLCipher build
        # is most likely to break (Design Review C6 risk register); macOS and
        # Linux keep the key-management abstraction honest across all three
        # credential stores.
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev             libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev             libayatana-appindicator3-dev libxdo-dev patchelf
      # `app/dist` is generated and gitignored, and `tauri.conf.json` points
      # `frontendDist` at it. A fresh checkout has no such directory, so the
      # Tauri build script fails on every platform — which is what made the
      # first push's `test`, `clippy` and `rustdoc` jobs all red while the same
      # commands passed locally, where a stale `dist/` happened to exist.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: build the frontend the Tauri crate embeds
        working-directory: app
        run: |
          npm ci
          npm run build
      - run: cargo test --workspace --all-features

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `app/src-tauri` is a workspace member, so every `--workspace` command
      # builds it — and its build script needs the webview headers. Without
      # these the job fails in `tauri-build`, nowhere near anything a reader
      # would connect to the desktop app.
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev             libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev             libayatana-appindicator3-dev libxdo-dev patchelf
      # `app/dist` is generated and gitignored, and `tauri.conf.json` points
      # `frontendDist` at it. A fresh checkout has no such directory, so the
      # Tauri build script fails on every platform — which is what made the
      # first push's `test`, `clippy` and `rustdoc` jobs all red while the same
      # commands passed locally, where a stale `dist/` happened to exist.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: build the frontend the Tauri crate embeds
        working-directory: app
        run: |
          npm ci
          npm run build
      # Intra-doc links carry the SDD cross-references; a broken one means the
      # code and the spec have drifted.
      - run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  corpus:
    name: corpus metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # PRD §5, enforced. --strict fails the build if recall or precision drop
      # below target, or a planted secret is missed. Only projects whose formats
      # have a parser in this build are gated; the rest are reported.
      - run: cargo run -p specshield-cli -- report corpus --strict

      # Ground truth must still describe the fixtures. Regenerating is the fix
      # for a failure here, never editing labels.json by hand.
      - name: labels are current
        run: |
          python3 corpus/tools/build_labels.py
          git diff --exit-code corpus/

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # ---------------------------------------------------------------------------
  # Milestone gates. Each becomes a required check as its milestone lands; they
  # are the PRD §5 success metrics, enforced rather than aspirational.
  #
  # M1  corpus:   DONE — enforced by the `corpus` job above
  # M1  roundtrip: DONE — proptest in crates/core/tests/roundtrip.rs
  # M1  leakgate:  DONE — property test, plus `specshield verify` exit code
  # M4  perf:     DONE — enforced by the `perf` job below
  # M6  offline:  DONE — enforced by the `offline` job below
  # ---------------------------------------------------------------------------

  perf:
    name: perf (M4 targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The Implementation Plan states these against a 1,000-file / ~150k-LOC
      # repo, so the repo is generated rather than assumed. Release build: a
      # debug binary would measure the profile, not the code.
      - run: cargo build --release -p specshield-cli
      - run: python3 bench/build_reference.py target/reference-project

      - name: cold index under 30s, rescan under 2s
        env:
          SPECSHIELD_PASSPHRASE: ci-only-not-a-secret
        run: |
          set -euo pipefail
          cd target/reference-project
          SS=../release/specshield
          "$SS" init . > /dev/null

          start=$(date +%s%N)
          "$SS" index > /dev/null
          index_ms=$(( ($(date +%s%N) - start) / 1000000 ))

          start=$(date +%s%N)
          "$SS" rescan > /dev/null
          rescan_ms=$(( ($(date +%s%N) - start) / 1000000 ))

          echo "cold index: ${index_ms}ms (budget 30000)"
          echo "rescan:     ${rescan_ms}ms (budget 2000)"

          # Generous by design. These are the plan's numbers, and the job exists
          # to catch an order-of-magnitude regression — a quadratic creeping
          # back in — not to police normal runner variance.
          test "$index_ms" -lt 30000
          test "$rescan_ms" -lt 2000

  offline:
    name: offline (zero egress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `app/src-tauri` is a workspace member, so every `--workspace` command
      # builds it — and its build script needs the webview headers. Without
      # these the job fails in `tauri-build`, nowhere near anything a reader
      # would connect to the desktop app.
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev             libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev             libayatana-appindicator3-dev libxdo-dev patchelf
      # `app/dist` is generated and gitignored, and `tauri.conf.json` points
      # `frontendDist` at it. A fresh checkout has no such directory, so the
      # Tauri build script fails on every platform — which is what made the
      # first push's `test`, `clippy` and `rustdoc` jobs all red while the same
      # commands passed locally, where a stale `dist/` happened to exist.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: build the frontend the Tauri crate embeds
        working-directory: app
        run: |
          npm ci
          npm run build

      # Built with the network, run without it. "No internet required" is a
      # promise in the PRD; this is the job that makes it a fact rather than an
      # intention, and it fails loudly the day a dependency starts phoning home.
      - run: cargo test --workspace --all-features --no-run

      - name: the whole suite passes with no route out
        run: |
          set -euo pipefail
          # A user namespace with its own empty network stack: loopback and
          # nothing else. Any outbound connection fails at the syscall.
          unshare --user --map-root-user --net -- bash -euc '
            ip link set lo up
            if getent hosts github.com > /dev/null 2>&1; then
              echo "the namespace still has DNS — the test would prove nothing" >&2
              exit 1
            fi
            cargo test --workspace --all-features --offline
          '
