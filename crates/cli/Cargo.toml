[package]
name = "specshield-cli"
description = "Headless driver over specshield-core: the CI and golden-corpus harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "specshield"
path = "src/main.rs"

[dependencies]
specshield-core.workspace = true
specshield-vault.workspace = true
specshield-index.workspace = true
specshield-project.workspace = true
specshield-parsers.workspace = true
specshield-git.workspace = true
uuid.workspace = true
anyhow.workspace = true
clap = { version = "4.6.6", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
getrandom = "0.4.3"
zeroize = "1.9.0"

[lints]
workspace = true

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
